[project]
name = "agentic-rag"
version = "0.1.0"
description = "Adaptive Agentic RAG platform with hybrid retrieval, QLoRA adaptation, and self-hosted vLLM inference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.7.0",
    "gitpython>=3.1.62",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-frontmatter>=1.3.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "tqdm>=4.70.1",
]

[project.scripts]
agentic-rag = "agentic_rag.cli:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "types-tqdm>=4.70.0.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear (likely bugs)
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade (modern syntax)
    "ARG",    # unused arguments
    "SIM",    # flake8-simplify
    "TID",    # tidy imports
    "PTH",    # use pathlib, not os.path
    "RUF",    # ruff-specific rules
    "ASYNC",  # async correctness
    "S",      # bandit security checks
]
ignore = [
    "E501",   # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # assert is expected in tests

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = []

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=agentic_rag",
    "--cov-report=term-missing",
    "--cov-fail-under=0",
]
markers = [
    "slow: tests that take more than a second",
    "integration: tests requiring external services",
]
